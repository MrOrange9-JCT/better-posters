name: CI

on:
  push:
    branches:
      - master
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      release_version:
        description: Existing bare SemVer tag to publish or recover
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Test
        run: dotnet test BetterPosters.sln --configuration Release --verbosity normal

  release:
    name: Release
    if: github.ref_type == 'tag' || inputs.release_version != ''
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: better-posters-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.release_version || github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install JPRM
        run: python -m pip install --disable-pip-version-check jprm==1.1.0

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use bare SemVer: $VERSION" >&2
            exit 1
          fi

          if ! git rev-parse --verify --quiet "refs/tags/$VERSION^{commit}" >/dev/null; then
            echo "Release tag does not exist: $VERSION" >&2
            exit 1
          fi

          plugin_version="$(sed -nE 's/^version: *"([^"]+)"/\1/p' build.yaml)"
          if [[ "$plugin_version" != "$VERSION.0" ]]; then
            echo "build.yaml version $plugin_version does not match tag $VERSION" >&2
            exit 1
          fi

          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            index($0, "## [") == 1 { found = 0 }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "CHANGELOG.md has no release notes for $VERSION" >&2
            exit 1
          fi

      - name: Build package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts
          python -m jprm plugin build . \
            --output artifacts \
            --dotnet-configuration Release \
            --version "$VERSION.0" \
            --dotnet-framework net9.0

          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.zip')
          if [[ "${#packages[@]}" -ne 1 ]]; then
            echo "Expected exactly one plugin package, found ${#packages[@]}" >&2
            exit 1
          fi

          package="${packages[0]}"
          md5sum "$package" > "$package.md5sum"
          sha256sum "$package" > "$package.sha256sum"
          echo "path=$package" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$package")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        id: release
        uses: actions/github-script@v9
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/release-notes.md
        with:
          retries: 3
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;
            const version = process.env.VERSION;
            const notes = fs.readFileSync(process.env.RELEASE_NOTES_PATH, 'utf8');
            const packagePaths = [
              process.env.PACKAGE_PATH,
              `${process.env.PACKAGE_PATH}.md5sum`,
              `${process.env.PACKAGE_PATH}.sha256sum`,
            ];

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });
            let release = releases.find((candidate) => candidate.tag_name === version);

            if (!release) {
              const response = await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: version,
                name: version,
                body: notes,
                draft: true,
                prerelease: false,
              });
              release = response.data;
            } else if (release.draft) {
              const response = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: version,
                body: notes,
                draft: true,
                prerelease: false,
              });
              release = response.data;
            }

            if (release.draft) {
              const existingAssets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner,
                  repo,
                  release_id: release.id,
                  per_page: 100,
                },
              );

              for (const packagePath of packagePaths) {
                const name = path.basename(packagePath);
                const existing = existingAssets.find((asset) => asset.name === name);
                if (existing) {
                  await github.rest.repos.deleteReleaseAsset({
                    owner,
                    repo,
                    asset_id: existing.id,
                  });
                }

                const data = fs.readFileSync(packagePath);
                await github.rest.repos.uploadReleaseAsset({
                  owner,
                  repo,
                  release_id: release.id,
                  name,
                  data,
                  headers: {
                    'content-type': name.endsWith('.zip')
                      ? 'application/zip'
                      : 'text/plain',
                    'content-length': data.length,
                  },
                });
              }

              const tags = await github.paginate(github.rest.repos.listTags, {
                owner,
                repo,
                per_page: 100,
              });
              const versions = tags
                .map((tag) => tag.name)
                .filter((tag) => /^\d+\.\d+\.\d+$/.test(tag))
                .sort((left, right) => {
                  const leftParts = left.split('.').map(Number);
                  const rightParts = right.split('.').map(Number);
                  for (let index = 0; index < 3; index += 1) {
                    if (leftParts[index] !== rightParts[index]) {
                      return leftParts[index] - rightParts[index];
                    }
                  }
                  return 0;
                });

              const response = await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: version,
                body: notes,
                draft: false,
                prerelease: false,
                make_latest: version === versions.at(-1) ? 'true' : 'false',
              });
              release = response.data;
            } else {
              core.notice(`Release ${version} is already published; preserving its assets.`);
            }

            const response = await github.rest.repos.getRelease({
              owner,
              repo,
              release_id: release.id,
            });
            release = response.data;

            if (release.draft) {
              throw new Error(`Release ${version} was not published.`);
            }

            const expectedAssets = packagePaths.map((packagePath) => path.basename(packagePath));
            for (const name of expectedAssets) {
              const asset = release.assets.find((candidate) => candidate.name === name);
              if (!asset || asset.state !== 'uploaded') {
                throw new Error(`Release asset ${name} is not uploaded.`);
              }
            }

            core.setOutput('release-id', release.id);

      - name: Verify published GitHub Release
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          latest_version="$(
            git tag --list |
              awk '/^[0-9]+\.[0-9]+\.[0-9]+$/ { print }' |
              sort --version-sort |
              tail --lines 1
          )"
          if [[ "$VERSION" == "$latest_version" ]]; then
            gh release edit "$VERSION" --latest
          fi

          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}"
          published_package="$RUNNER_TEMP/$PACKAGE_NAME"
          published_md5="$RUNNER_TEMP/$PACKAGE_NAME.md5sum"

          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
            --output "$published_package" "$release_url/$PACKAGE_NAME"
          curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
            --output "$published_md5" "$release_url/$PACKAGE_NAME.md5sum"

          expected_md5="$(awk '{ print $1; exit }' "$published_md5")"
          echo "$expected_md5  $published_package" | md5sum --check --strict -
          cp -- "$published_package" "$PACKAGE_PATH"

          if [[ "$VERSION" == "$latest_version" ]]; then
            latest_release="$RUNNER_TEMP/latest-release.json"
            curl --fail --location --retry 6 --retry-all-errors --retry-delay 2 \
              --output "$latest_release" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
            if [[ "$(jq --raw-output '.tag_name' "$latest_release")" != "$VERSION" ]]; then
              echo "Release $VERSION is not the public latest release." >&2
              exit 1
            fi
          fi

      - name: Update plugin manifest
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin master
          git checkout -B master origin/master

          plugin_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/${PACKAGE_NAME}"
          python -m jprm repo add --plugin-url "$plugin_url" ./manifest.json "$PACKAGE_PATH"

          package_md5="$(md5sum "$PACKAGE_PATH" | awk '{ print $1 }')"
          manifest_md5="$(
            jq --raw-output --arg url "$plugin_url" '
              [.[] | .versions[] | select(.sourceUrl == $url) | .checksum] |
              last // empty
            ' manifest.json
          )"
          if [[ "$manifest_md5" != "$package_md5" ]]; then
            echo "Generated manifest checksum does not match the public package." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json

          if git diff --cached --quiet; then
            echo "Manifest already up to date."
            exit 0
          fi

          git commit -m "Update Jellyfin plugin manifest [skip ci]"
          git push origin HEAD:master
